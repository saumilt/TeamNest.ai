name: Backend CI

# Foundational checks for the shared FastAPI backend.
# Path-filtered on push so backend-only pushes don't trigger the web/mobile
# pipelines; PRs run every pipeline. This pass is lint + pure unit tests.
# Full integration tests (live API + MongoDB + secrets) run separately/manually.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy config so imports succeed. Motor's client is lazy (no real
      # connection happens). No real secrets are used or needed here.
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: teamnest_ci
      JWT_SECRET: ci-not-a-secret
      PUBLIC_BACKEND_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        # A slim, public-only subset (see requirements-ci.txt). The full
        # requirements.txt needs a private package that isn't resolvable on
        # GitHub runners, so it's intentionally not installed here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (syntax / undefined-name errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pure unit tests (no network / DB)
        run: python -m pytest tests/test_unit_resolve_app_base.py -q
