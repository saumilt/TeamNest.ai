name: Backend CI

# Foundational checks for the shared FastAPI backend.
# Path-filtered so backend-only changes don't trigger the web/mobile pipelines.
# Full integration tests (which need a live API + MongoDB + secrets) are run
# separately/manually — this pass is lint + import verification + pure unit tests.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy config so imports succeed. Motor's client is lazy (no real
      # connection happens). No real secrets are used or needed here.
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: teamnest_ci
      JWT_SECRET: ci-not-a-secret
      PUBLIC_BACKEND_URL: http://localhost:8001
      # A few integration test modules read these at import time; set dummy
      # values so `--collect-only` can import every module cleanly.
      REACT_APP_BACKEND_URL: http://localhost:8001
      EXPO_PUBLIC_BACKEND_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # emergentintegrations is hosted on a private index, so add it here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Lint (syntax / undefined-name errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify all tests import (collect-only, no network)
        run: python -m pytest tests/ --collect-only -q

      - name: Run pure unit tests (no network / DB)
        run: python -m pytest tests/test_unit_resolve_app_base.py -q
