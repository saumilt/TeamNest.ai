name: Mobile CI

# Foundational checks for the Expo / React Native app (/app/mobile).
# Path-filtered so mobile-only changes don't trigger the backend/web pipelines.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        # Plain install (not --frozen-lockfile) so CI stays green even if the
        # committed lockfile drifts slightly across environments.
        run: yarn install

      - name: Run tests
        run: yarn test --ci
